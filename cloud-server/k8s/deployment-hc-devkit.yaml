apiVersion: v1
kind: Service
metadata:
  name: hc-devkit
  namespace: huaweicloud-agent
  labels:
    app: hc-devkit
spec:
  type: LoadBalancer
  selector:
    app: hc-devkit
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
