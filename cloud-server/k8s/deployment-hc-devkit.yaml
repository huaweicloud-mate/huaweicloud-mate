apiVersion: apps/v1
kind: Deployment
metadata:
  name: hc-devkit
  namespace: huaweicloud-agent
  labels:
    app: hc-devkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hc-devkit
  template:
    metadata:
      labels:
        app: hc-devkit
    spec:
      imagePullSecrets:
        - name: swr-secret
      containers:
        - name: server
          image: swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/hc-devkit:placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NAMESPACE
              value: "huaweicloud-agent"
            - name: PUBLIC_URL
              value: "http://hc-devkit.huaweicloud-agent:3000"
            - name: SANDBOX_IMAGE
              value: "swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/sandbox:20260730210614"
            - name: MAX_SANDBOXES
              value: "5"
            - name: MAX_ANON_SANDBOXES
              value: "3"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_URL
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_HOST
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_PASSWORD
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DEEPSEEK_API_KEY
            - name: INCENTIVE_API_URL
              value: "https://apigw-beta.huawei.com/api/v1/hdincentiveservice/coupon"
            - name: INCENTIVE_HW_ID
              value: "com.huawei.cloudbu.developer.community"
            - name: INCENTIVE_APPKEY
              value: "qUj0aJHBiL5RW5VUEW5hCg=="
            - name: INCENTIVE_APPCODE
              value: "5MkJTaYq6L6S8xBm1Tt0cLoB0fuDKkrV2bj3T8fvlGWtLp2WaJzKCP5darNWFa19"
            - name: INCENTIVE_ACTIVITY_ID
              value: "A000330"
            - name: INCENTIVE_ACTIVITY_PRODUCT_ID
              value: "5649bf1d2bc74d648ac6cd5496ebba91"
            - name: INCENTIVE_MAX_VOUCHERS
              value: "200"
            - name: INCENTIVE_AUTH_TOKEN
              value: "-wLvZpUhSlJwxAmFUNHaRzMjukiqITcnGL6oa2MhS8lDDf2Luda2fcmDAveeL4J99TecdpWNflPJnH+sjh+Y3p8pF3OtmcHZiCge8rO5hg47aINnSG+pkNHKuZszK419MLQjN+vIZsgf5eN7GQpa+72yr8Y7++MWuT3P4lTXun9kGKoxZpGa5nueuC3lPiqNTOh8SrdkhtPGHx-37OmKaF58TcVVmAZ+rgJWRyZSTs-1h7VnRi3FT9iLj7yiB-k4IruXFyh9u4EQKknDxRhfcYRywRdx46UHIaVIhtiGvssQCT7X2OA3pHMRKibOpdoqY3j1CrZmDWlDVic1hbMOpBMDVcskNWUgeVtNp5SzGsxhVuBJK1072WAIyVs3xpd6-NtCzaoG3pvT6iqE0+2E9BwT1SV6Is0F5XtmD-YZB4VL+CQJTPpyAI-lsJvAejDnzCdq9J2Dy1M-XHnv4nwYEkEzCoI"
