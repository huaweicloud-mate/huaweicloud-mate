apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-creator
  namespace: huaweicloud-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-manager
  namespace: huaweicloud-agent
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: huaweicloud-agent
subjects:
  - kind: ServiceAccount
    name: job-creator
roleRef:
  kind: Role
  name: job-manager
  apiGroup: rbac.authorization.k8s.io
