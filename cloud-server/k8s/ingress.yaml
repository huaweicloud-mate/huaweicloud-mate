apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a2a-server
  namespace: huaweicloud-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: a2a-server
                port:
                  number: 3000
