apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-server
  namespace: huaweicloud-agent
spec:
  replicas: 1  # single replica — task state in-memory
  selector:
    matchLabels:
      app: a2a-server
  template:
    metadata:
      labels:
        app: a2a-server
    spec:
      serviceAccountName: job-creator
      containers:
        - name: server
          image: swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/server:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: a2a-server-config
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
