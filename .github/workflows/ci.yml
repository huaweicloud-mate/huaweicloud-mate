name: CI / Test

on:
  push:
    branches: [main, dev, 'dev_*']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm run build

      - name: Verify MCP server starts
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | timeout 10 node dist/router/index.js 2>/dev/null | grep -q "cloud_capability_search" && echo "Router OK" || echo "Router FAILED"
        shell: bash
