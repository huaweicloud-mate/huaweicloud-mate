name: CD Production

on:
  push:
    tags:
      - 'v*'

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci && npm test

      - name: Build & Push to SWR
        env:
          SWR_USER: ${{ secrets.SWR_USER }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "$SWR_PASSWORD" | docker login -u "$SWR_USER" --password-stdin swr.cn-south-1.myhuaweicloud.com
          docker build -t swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/hdkitservice:$TAG -f cloud-server/docker/Dockerfile.server.hcloud .
          docker push swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/hdkitservice:$TAG

      - name: Deploy to CCE
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BUILD_HOST }}
          username: ${{ secrets.BUILD_USER }}
          password: ${{ secrets.BUILD_PASSWORD }}
          script: |
            kubectl --kubeconfig=/tmp/kubeconfig.json \
              -n huaweicloud-agent \
              set image deployment/hdkitservice \
              server=swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/hdkitservice:$TAG
            kubectl --kubeconfig=/tmp/kubeconfig.json \
              -n huaweicloud-agent \
              rollout status deployment/hdkitservice --timeout=60s
