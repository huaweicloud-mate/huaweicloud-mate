name: CD Staging

on:
  push:
    branches: [main, develop]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci && npm test

      - name: Build & Push to SWR
        env:
          SWR_USER: ${{ secrets.SWR_USER }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
        run: |
          echo "$SWR_PASSWORD" | docker login -u "$SWR_USER" --password-stdin swr.cn-south-1.myhuaweicloud.com
          docker build -t swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/hdkitservice:${GITHUB_SHA::8} -f cloud-server/docker/Dockerfile.server.hcloud .
          docker push swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/hdkitservice:${GITHUB_SHA::8}
